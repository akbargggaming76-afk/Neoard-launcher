
name: Build Neoard Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -name '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted
          fi

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' \
            -not -path './.gradle/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/app/src/main/AndroidManifest.xml" ]; then
            echo "::error::AndroidManifest.xml not found"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Rewrite Android Gradle configuration
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          cat > app/build.gradle.kts <<'EOF'
          plugins {
              id("com.android.application")
              id("org.jetbrains.kotlin.android")
              id("org.jetbrains.kotlin.plugin.compose")
          }

          android {
              namespace = "com.neoard.launcher"
              compileSdk = 35

              defaultConfig {
                  applicationId = "com.neoard.launcher"
                  minSdk = 26
                  targetSdk = 35
                  versionCode = 1
                  versionName = "0.1"
              }

              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }

              kotlinOptions {
                  jvmTarget = "17"
              }
          }

          dependencies {
              implementation(platform("androidx.compose:compose-bom:2024.12.01"))
              implementation("androidx.activity:activity-compose:1.10.0")
              implementation("androidx.compose.ui:ui")
              implementation("androidx.compose.ui:ui-tooling-preview")
              implementation("androidx.compose.material3:material3")
              implementation("androidx.compose.material:material-icons-extended")
              implementation("androidx.lifecycle:lifecycle-runtime-ktx:2.8.7")
              debugImplementation("androidx.compose.ui:ui-tooling")
          }
          EOF

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neoard-Launcher-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

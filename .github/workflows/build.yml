
name: Build Neoard Launcher APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        shell: bash
        run: |
          ZIP=$(find . -type f -name '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -n "$ZIP" ]; then
            mkdir -p extracted
            unzip -oq "$ZIP" -d extracted
          fi

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -e
          SETTINGS=$(find . -type f \
            \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path './.git/*' | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Gradle project not found"
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/app/build.gradle.kts" ] && \
             [ ! -f "$DIR/app/build.gradle" ]; then
            echo "::error::App Gradle file not found"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Fix Java and Kotlin target
        working-directory: ${{ steps.locate.outputs.dir }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("app/build.gradle.kts")
          s = p.read_text()

          if "compileOptions {" not in s:
              s = s.replace(
                  "\n}\n",
                  """
              compileOptions {
                  sourceCompatibility = JavaVersion.VERSION_17
                  targetCompatibility = JavaVersion.VERSION_17
              }
          }
          """,
                  1
              )

          if "kotlinOptions {" not in s:
              s = s.replace(
                  "\n}\n",
                  """
              kotlinOptions {
                  jvmTarget = "17"
              }
          }
          """,
                  1
              )

          p.write_text(s)
          print("Java/Kotlin target configured.")
          PY

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neoard-Launcher-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

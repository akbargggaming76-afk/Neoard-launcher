
name: Build Neoard Launcher APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract source ZIP
        shell: bash
        run: |
          set -e
          ZIP=$(find . -type f -iname '*.zip' \
            -not -path './.git/*' | head -n 1)

          if [ -n "$ZIP" ]; then
            mkdir -p source-unpacked
            unzip -oq "$ZIP" -d source-unpacked
          fi

      - name: Find Android project
        id: locate
        shell: bash
        run: |
          set -e

          SETTINGS=$(find . \
            -type f \
            \( -name settings.gradle \
            -o -name settings.gradle.kts \) \
            -not -path './.git/*' \
            -not -path './.gradle/*' \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "::error::Source Android belum diupload!"
            find . -maxdepth 4 -type f
            exit 1
          fi

          DIR=$(dirname "$SETTINGS")

          if [ ! -f "$DIR/app/build.gradle.kts" ] && \
             [ ! -f "$DIR/app/build.gradle" ]; then
            echo "::error::app/build.gradle tidak ditemukan!"
            exit 1
          fi

          echo "dir=$DIR" >> "$GITHUB_OUTPUT"

      - name: Build APK
        working-directory: ${{ steps.locate.outputs.dir }}
        run: gradle --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Neoard-Launcher-APK
          path: ${{ steps.locate.outputs.dir }}/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
